<style>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const fill=document.getElementById('loading-fill');
const prog=p=>{fill.style.width=Math.min(p,100)+'%';};

/* ===================== SCENE ===================== */
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x000000,0.01);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,600);
camera.position.set(7,3.5,7);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.2;
controls.minDistance=2.5;controls.maxDistance=22;
controls.target.set(0,2.8,0);controls.maxPolarAngle=Math.PI*0.88;
controls.update();

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.5,0.7,0.32));
prog(8);

/* ===================== LIGHTING ===================== */
scene.add(new THREE.AmbientLight(0x151520,0.45));
const moon=new THREE.DirectionalLight(0xc8c0a0,0.8);moon.position.set(-6,14,8);scene.add(moon);
const fillL=new THREE.DirectionalLight(0x3a5070,0.2);fillL.position.set(5,2,-6);scene.add(fillL);
const rimL=new THREE.DirectionalLight(0x506080,0.3);rimL.position.set(0,4,-10);scene.add(rimL);
const warmSpot=new THREE.PointLight(0xc9a060,0.15,14);warmSpot.position.set(1,0.5,2);scene.add(warmSpot);
const canopyGlow=new THREE.PointLight(0x5a7a4a,0.0,10);canopyGlow.position.set(-0.5,5,0);scene.add(canopyGlow);
prog(12);

/* ===================== SKY — sparse stars, subtle color ===================== */
const skyVS=`varying vec3 vDir;void main(){vDir=(modelMatrix*vec4(position,1.0)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
const skyFS=`
uniform float uTime;varying vec3 vDir;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.0,a=0.5;mat2 r=mat2(0.8,0.6,-0.6,0.8);for(int i=0;i<5;i++){v+=a*noise(p);p=r*p*2.0;a*=0.5;}return v;}
void main(){
  vec3 d=normalize(vDir);float phi=atan(d.z,d.x),theta=acos(clamp(d.y,-1.0,1.0));
  float r=theta/3.14159;
  float n=fbm(vec2(phi*0.8,theta*1.2)+uTime*0.003)*0.5;
  vec3 col=vec3(0.0);
  col+=vec3(0.025,0.005,0.06)*n*smoothstep(0.6,0.0,r);
  col+=vec3(0.0,0.015,0.05)*fbm(vec2(phi*1.5,theta*2.0)-uTime*0.005)*(1.0-r*0.5)*0.4;
  gl_FragColor=vec4(col,1.0);
}`;
const skyMat=new THREE.ShaderMaterial({vertexShader:skyVS,fragmentShader:skyFS,uniforms:{uTime:{value:0}},side:THREE.BackSide});
scene.add(new THREE.Mesh(new THREE.IcosahedronGeometry(250,5),skyMat));

// sparse bright star sprites
(function(){
  const c=document.createElement('canvas');c.width=64;c.height=64;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(32,32,0,32,32,30);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.12,'rgba(255,250,240,0.7)');
  g.addColorStop(0.35,'rgba(180,200,255,0.15)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,64,64);
  const tex=new THREE.CanvasTexture(c);
  for(let i=0;i<12;i++){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,blending:THREE.AdditiveBlending,opacity:0.5+Math.random()*0.5}));
    sp.scale.setScalar(1.5+Math.random()*3);
    const R=160+Math.random()*40,th=Math.random()*Math.PI*2,ph=Math.random()*Math.PI*0.7;
    sp.position.set(R*Math.sin(ph)*Math.cos(th),R*Math.cos(ph)+15,R*Math.sin(ph)*Math.sin(th));
    sp.userData.twinklePhase=Math.random()*6.28;
    sp.userData.twinkleSpeed=0.5+Math.random()*1.5;
    scene.add(sp);
  }
})();
prog(18);

/* ===================== BARK SHADER — cracks, growth transition ===================== */
const MAX_SRC=8;
const gSrcArr=Array.from({length:MAX_SRC},()=>new THREE.Vector3(0,-100,0));
const gRadArr=new Array(MAX_SRC).fill(0);

const barkVS=`
varying vec3 vWP;varying vec3 vN;varying vec3 vVP;
void main(){
  vec4 wp=modelMatrix*vec4(position,1.0);vWP=wp.xyz;
  vN=normalize(mat3(modelMatrix)*normal);
  vVP=(viewMatrix*wp).xyz;
  gl_Position=projectionMatrix*viewMatrix*wp;
}`;
const barkFS=`
uniform vec3 uGS[8];uniform float uGR[8];
uniform vec3 uTP;uniform float uTS;
varying vec3 vWP;varying vec3 vN;varying vec3 vVP;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.0,a=0.5;mat2 r=mat2(0.8,0.6,-0.6,0.8);for(int i=0;i<5;i++){v+=a*noise(p);p=r*p*2.0;a*=0.5;}return v;}
float getGrowth(){
  float m=0.0;
  for(int i=0;i<8;i++){
    float d=distance(vWP,uGS[i]);
    m=max(m,smoothstep(uGR[i],max(0.0,uGR[i]-1.0),d));
  }
  return clamp(m,0.0,1.0);
}
void main(){
  vec2 bk=vec2(atan(vWP.x,vWP.z)*2.0,vWP.y*4.0);
  float bark=fbm(bk*5.0);
  float groove=smoothstep(0.3,0.55,bark);
  float fine=noise(bk*35.0)*0.1;
  float crack=fbm(bk*8.0+3.0);
  float crackLine=smoothstep(0.42,0.48,crack)*0.25;
  float growth=getGrowth();
  float crackDepth=mix(0.75,0.4,growth);
  vec3 deadBase=vec3(0.30,0.27,0.24);vec3 deadDark=vec3(0.13,0.11,0.10);
  vec3 liveBase=vec3(0.38,0.27,0.17);vec3 liveDark=vec3(0.18,0.12,0.07);
  vec3 base=mix(deadBase,liveBase,growth);
  vec3 dark=mix(deadDark,liveDark,growth);
  vec3 col=mix(base,dark,groove*crackDepth+crackLine);
  col+=mix(vec3(0.0),vec3(0.02,0.04,0.01),growth*noise(bk*4.0)*0.8);
  col+=fine*mix(vec3(0.08),vec3(0.12,0.08,0.03),growth);
  vec3 ld=normalize(vec3(-0.5,1.0,0.8));
  float diff=max(dot(vN,ld),0.0);
  float ao=0.65+0.35*(1.0-groove);
  col*=(0.28+diff*0.72)*ao;
  vec3 vd=normalize(-vVP);
  float rim=1.0-max(dot(vN,vd),0.0);
  col+=vec3(0.10,0.08,0.05)*pow(rim,3.0)*0.2;
  float td=distance(vWP,uTP);
  col+=vec3(0.85,0.6,0.3)*exp(-td*2.5)*uTS*0.6;
  gl_FragColor=vec4(col,1.0);
}`;
const barkMat=new THREE.ShaderMaterial({
  vertexShader:barkVS,fragmentShader:barkFS,
  uniforms:{uGS:{value:gSrcArr},uGR:{value:gRadArr},uTP:{value:new THREE.Vector3(0,-100,0)},uTS:{value:0}}
});
prog(24);

/* ===================== LEAF SHADER — glossy green top, rusty fuzz bottom ===================== */
const leafVS=`
varying vec3 vN;varying vec3 vWP;varying vec3 vVD;varying vec3 vCol;
void main(){
  vec3 tp=position;vec3 tn=normal;
  #ifdef USE_INSTANCING
    tp=(instanceMatrix*vec4(tp,1.0)).xyz;
    tn=mat3(instanceMatrix)*tn;
  #endif
  vec4 wp=modelMatrix*vec4(tp,1.0);
  vWP=wp.xyz;vN=normalize(mat3(modelMatrix)*tn);
  vVD=normalize(cameraPosition-wp.xyz);
  #ifdef USE_INSTANCING_COLOR
    vCol=instanceColor;
  #else
    vCol=vec3(1.0);
  #endif
  gl_Position=projectionMatrix*viewMatrix*wp;
}`;
const leafFS=`
varying vec3 vN;varying vec3 vWP;varying vec3 vVD;varying vec3 vCol;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){
  vec3 n=gl_FrontFacing?normalize(vN):-normalize(vN);
  vec3 v=normalize(vVD);
  vec3 l=normalize(vec3(-0.5,1.0,0.8));
  vec3 color;
  if(gl_FrontFacing){
    vec3 base=vec3(0.08,0.24,0.05)*vCol*1.8;
    float diff=max(dot(n,l),0.0);
    color=base*(0.3+diff*0.7);
    vec3 h=normalize(l+v);
    color+=vec3(0.55,0.65,0.45)*pow(max(dot(n,h),0.0),55.0)*0.35;
    float rim=pow(1.0-max(dot(n,v),0.0),3.5);
    color+=vec3(0.06,0.10,0.03)*rim*0.3;
  } else {
    vec3 base=vec3(0.46,0.32,0.17);
    float diff=max(dot(n,l),0.0);
    color=base*(0.25+diff*0.4);
    float rim=pow(1.0-max(dot(n,v),0.0),1.5);
    color+=vec3(0.52,0.34,0.15)*rim*0.6;
    float fuzz=hash(floor(vWP.xz*250.0));
    color+=vec3(0.10,0.05,0.02)*fuzz*0.18;
  }
  gl_FragColor=vec4(color,0.96);
}`;
const leafMat=new THREE.ShaderMaterial({
  vertexShader:leafVS,fragmentShader:leafFS,
  side:THREE.DoubleSide,transparent:true
});
prog(28);

/* ===================== TAPERED TUBE HELPER ===================== */
function taperedTube(pts,rS,rE,segs,rad){
  const curve=new THREE.CatmullRomCurve3(pts);
  const g=new THREE.TubeGeometry(curve,segs,1.0,rad,false);
  const pos=g.attributes.position;const rs=rad+1;
  for(let ring=0;ring<=segs;ring++){
    const t=ring/segs,r=rS+(rE-rS)*t;
    const c=curve.getPointAt(Math.min(t,1));
    for(let j=0;j<=rad;j++){
      const idx=ring*rs+j;if(idx>=pos.count)continue;
      const dx=pos.getX(idx)-c.x,dy=pos.getY(idx)-c.y,dz=pos.getZ(idx)-c.z;
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d>0.0001){const s=r/d;pos.setXYZ(idx,c.x+dx*s,c.y+dy*s,c.z+dz*s);}
    }
  }
  pos.needsUpdate=true;g.computeVertexNormals();return g;
}

/* ===================== TREE STRUCTURE ===================== */
const brG=[];const leafD=[];const flowerD=[];const fruitD=[];

const trunk=[V3(0,0,0),V3(0.12,0.55,0.08),V3(-0.06,1.2,0.14),V3(0.14,1.9,-0.04),V3(0.02,2.55,0.08)];
brG.push(taperedTube(trunk,0.30,0.16,16,16));

const a0=trunk[4];
const brA=[a0,V3(a0.x+0.35,a0.y+0.55,a0.z+0.12),V3(a0.x+0.7,a0.y+1.3,a0.z-0.1),V3(a0.x+0.45,a0.y+2.1,a0.z+0.25),V3(a0.x+0.15,a0.y+2.8,a0.z+0.05)];
brG.push(taperedTube(brA,0.13,0.035,14,14));

const b0=trunk[3];
const brB=[b0,V3(b0.x-0.4,b0.y+0.3,b0.z+0.35),V3(b0.x-1.1,b0.y+0.15,b0.z+0.55),V3(b0.x-1.6,b0.y+0.7,b0.z+0.3),V3(b0.x-1.3,b0.y+1.4,b0.z+0.0)];
brG.push(taperedTube(brB,0.11,0.03,14,14));

const brC=[a0,V3(a0.x+0.1,a0.y+0.4,a0.z+0.5),V3(a0.x-0.15,a0.y+0.9,a0.z+1.1),V3(a0.x-0.3,a0.y+1.5,a0.z+1.3)];
brG.push(taperedTube(brC,0.09,0.025,12,12));

const d0=trunk[2];
const brD=[d0,V3(d0.x+0.5,d0.y+0.05,d0.z-0.35),V3(d0.x+1.1,d0.y-0.15,d0.z-0.6),V3(d0.x+1.5,d0.y+0.25,d0.z-0.9),V3(d0.x+1.7,d0.y+0.9,d0.z-0.65)];
brG.push(taperedTube(brD,0.10,0.028,14,14));

const e0=trunk[1];
const brE=[e0,V3(e0.x+0.4,e0.y+0.1,e0.z+0.2),V3(e0.x+0.7,e0.y-0.05,e0.z+0.35),V3(e0.x+0.9,e0.y+0.2,e0.z+0.25)];
brG.push(taperedTube(brE,0.07,0.02,10,10));

prog(38);

const mainTips=[
  {pos:brA[4],dir:V3(-0.2,0.6,0.1).normalize(),r:0.035},
  {pos:brA[3],dir:V3(0.5,0.4,-0.2).normalize(),r:0.04},
  {pos:brB[4],dir:V3(-0.3,0.5,-0.2).normalize(),r:0.03},
  {pos:brB[3],dir:V3(-0.5,0.3,0.4).normalize(),r:0.035},
  {pos:brC[3],dir:V3(-0.2,0.5,0.4).normalize(),r:0.025},
  {pos:brC[2],dir:V3(0.4,0.3,0.5).normalize(),r:0.03},
  {pos:brD[4],dir:V3(0.2,0.5,-0.3).normalize(),r:0.028},
  {pos:brD[3],dir:V3(0.6,0.2,-0.4).normalize(),r:0.03},
  {pos:brE[3],dir:V3(0.3,0.4,0.1).normalize(),r:0.02},
  {pos:a0,dir:V3(-0.1,0.7,-0.3).normalize(),r:0.06},
  {pos:b0,dir:V3(0.3,0.5,0.4).normalize(),r:0.05},
];

/* ===================== SUB-BRANCHES ===================== */
function subBranch(start,dir,len,rad,depth,maxD){
  if(depth>maxD||rad<0.004)return;
  const n=3+Math.floor(Math.random()*2);
  const pts=[start.clone()];const d=dir.clone();
  for(let i=1;i<=n;i++){
    d.x+=(Math.random()-0.5)*0.25;d.z+=(Math.random()-0.5)*0.25;
    d.y+=(Math.random()-0.35)*0.18;d.normalize();
    pts.push(pts[i-1].clone().add(d.clone().multiplyScalar(len/n)));
  }
  brG.push(taperedTube(pts,rad,rad*0.45,Math.max(4,8-depth),Math.max(6,12-depth*2)));
  const end=pts[pts.length-1];
  if(depth>=1){
    const lc=depth>=2?16+Math.floor(Math.random()*12):8+Math.floor(Math.random()*6);
    const sp=0.12+depth*0.06;
    for(let i=0;i<lc;i++){
      const off=V3((Math.random()-0.5)*sp*2,(Math.random()-0.5)*sp*1.5,(Math.random()-0.5)*sp*2);
      leafD.push({p:end.clone().add(off),n:off.clone().normalize().add(V3(0,0.3,0)).normalize()});
    }
    for(let j=1;j<pts.length-1;j++){
      if(Math.random()>0.5)continue;
      for(let k=0;k<3+Math.floor(Math.random()*3);k++){
        const o2=V3((Math.random()-0.5)*sp,(Math.random()-0.5)*sp*0.5,(Math.random()-0.5)*sp);
        leafD.push({p:pts[j].clone().add(o2),n:o2.clone().normalize().add(V3(0,0.3,0)).normalize()});
      }
    }
  }
  if(depth>=1&&Math.random()>0.4){
    const fc=2+Math.floor(Math.random()*3);
    for(let i=0;i<fc;i++) flowerD.push(end.clone().add(V3((Math.random()-0.5)*0.1,Math.random()*0.06,(Math.random()-0.5)*0.1)));
    const frc=2+Math.floor(Math.random()*4);
    for(let i=0;i<frc;i++) fruitD.push(end.clone().add(V3((Math.random()-0.5)*0.16,-Math.random()*0.16-0.02,(Math.random()-0.5)*0.16)));
  }
  if(depth<maxD){
    const nc=depth<1?3:2+Math.floor(Math.random()*2);
    for(let i=0;i<nc;i++){
      const ed=d.clone();let pp=V3(1,0,0);if(Math.abs(ed.dot(pp))>0.9)pp=V3(0,0,1);
      const rt=V3().crossVectors(ed,pp).normalize();const fw=V3().crossVectors(rt,ed).normalize();
      const sa=0.35+Math.random()*0.4,az=(i/nc)*Math.PI*2+(Math.random()-0.5)*1.0;
      const cd=V3().addScaledVector(ed,Math.cos(sa)).addScaledVector(rt,Math.sin(sa)*Math.cos(az)).addScaledVector(fw,Math.sin(sa)*Math.sin(az));
      cd.y+=0.08*Math.max(0,1-depth*0.2);cd.normalize();
      subBranch(end,cd,len*(0.5+Math.random()*0.22),rad*(0.48+Math.random()*0.18),depth+1,maxD);
    }
  }
}
mainTips.forEach(t=>subBranch(t.pos,t.dir,0.8+Math.random()*0.6,t.r,0,3));
prog(50);

/* ===================== ROOTS ===================== */
for(let i=0;i<5;i++){
  const a=(i/5)*Math.PI*2+Math.random()*0.3;
  const pts=[V3(Math.cos(a)*0.14,0.28,Math.sin(a)*0.14),V3(Math.cos(a)*0.26,0.12,Math.sin(a)*0.26),V3(Math.cos(a)*0.36,0.01,Math.sin(a)*0.36),V3(Math.cos(a)*0.42,-0.04,Math.sin(a)*0.42)];
  brG.push(taperedTube(pts,0.075,0.018,8,10));
}
for(let i=0;i<10;i++){
  const a=(i/10)*Math.PI*2+Math.random()*0.3;
  const rl=0.7+Math.random()*1.4,rr=0.015+Math.random()*0.03;
  const pts=[V3(Math.cos(a)*0.36,0.01,Math.sin(a)*0.36)];
  const rd=V3(Math.cos(a),-0.06,Math.sin(a)).normalize();
  for(let s=0;s<5;s++){rd.y-=0.012;rd.x+=(Math.random()-0.5)*0.12;rd.z+=(Math.random()-0.5)*0.12;rd.normalize();pts.push(pts[pts.length-1].clone().add(rd.clone().multiplyScalar(rl/5)));}
  brG.push(taperedTube(pts,rr,rr*0.2,8,8));
}
prog(56);

/* ===================== MERGE BRANCHES ===================== */
let branchMesh;
const merged=mergeGeometries(brG,false);
if(merged){branchMesh=new THREE.Mesh(merged,barkMat);scene.add(branchMesh);}
prog(62);

/* ===================== LEAVES ===================== */
function mkLeaf(){
  const sh=new THREE.Shape();const w=0.05,l=0.14;
  sh.moveTo(0,-l);
  sh.bezierCurveTo(w*0.35,-l*0.6,w*1.05,-l*0.15,w,0.02);
  sh.bezierCurveTo(w*0.85,l*0.4,w*0.45,l*0.78,0,l);
  sh.bezierCurveTo(-w*0.45,l*0.78,-w*0.85,l*0.4,-w,0.02);
  sh.bezierCurveTo(-w*1.05,-l*0.15,-w*0.35,-l*0.6,0,-l);
  const g=new THREE.ShapeGeometry(sh,8);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i);p.setZ(i,-Math.abs(x)*3*0.12+Math.sin(y*10)*0.004);}
  p.needsUpdate=true;g.computeVertexNormals();return g;
}
const leafGeom=mkLeaf();
const leafCount=leafD.length;
const leafInst=new THREE.InstancedMesh(leafGeom,leafMat,leafCount);
const dum=new THREE.Object3D();

const leafBases=[];
for(let i=0;i<leafCount;i++){
  const ld=leafD[i];
  dum.position.copy(ld.p);dum.lookAt(ld.p.clone().add(ld.n));
  dum.rotateZ(Math.random()*Math.PI*2);dum.rotateX((Math.random()-0.5)*0.7);
  const s=0.6+Math.random()*0.6;dum.scale.set(0.001,0.001,0.001);
  dum.updateMatrix();leafInst.setMatrixAt(i,dum.matrix);
  const c=new THREE.Color().setHSL(0.25+(Math.random()-0.5)*0.09,0.4+Math.random()*0.38,0.11+Math.random()*0.17);
  leafInst.setColorAt(i,c);
  leafBases.push({p:ld.p.clone(),q:dum.quaternion.clone(),s:s,ph:Math.random()*6.28});
  dum.scale.set(s,s,s);dum.updateMatrix();
}
leafInst.instanceMatrix.needsUpdate=true;
if(leafInst.instanceColor)leafInst.instanceColor.needsUpdate=true;
scene.add(leafInst);
prog(72);

/* ===================== FLOWERS — panicle clusters ===================== */
function mkPanicle(){
  const gs=[];
  for(let i=0;i<7;i++){
    const r=0.006+Math.random()*0.005;
    const s=new THREE.SphereGeometry(r,6,6);
    const a=(i/7)*Math.PI*2+Math.random()*0.5,h=i*0.007;
    s.translate(Math.cos(a)*0.015,h,Math.sin(a)*0.015);gs.push(s);
  }
  return mergeGeometries(gs,false);
}
const panicleGeom=mkPanicle();
const flowerMat2=new THREE.MeshStandardMaterial({color:0xFFF5E0,roughness:0.6,emissive:0x332200,emissiveIntensity:0.08});
const flowerCount=flowerD.length;
const flowerInst=new THREE.InstancedMesh(panicleGeom,flowerMat2,flowerCount);
const flowerBases=[];
for(let i=0;i<flowerCount;i++){
  dum.position.copy(flowerD[i]);dum.rotation.set(Math.random(),Math.random()*6.28,Math.random());
  dum.scale.set(0.001,0.001,0.001);dum.updateMatrix();
  flowerInst.setMatrixAt(i,dum.matrix);
  flowerBases.push({p:flowerD[i].clone(),q:dum.quaternion.clone()});
}
flowerInst.instanceMatrix.needsUpdate=true;
scene.add(flowerInst);
prog(78);

/* ===================== FRUITS ===================== */
function mkFruit(){
  const g=new THREE.SphereGeometry(0.03,18,18);const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    let x=p.getX(i),y=p.getY(i),z=p.getZ(i);y*=1.3;
    if(y>0){const sq=1-y*3.2;x*=Math.max(0.55,sq);z*=Math.max(0.55,sq);}
    if(y<-0.005){const bl=1+Math.sin((-y/0.04)*Math.PI*0.5)*0.14;x*=bl;z*=bl;}
    p.setXYZ(i,x,y,z);
  }
  p.needsUpdate=true;g.computeVertexNormals();return g;
}
const fruitGeom=mkFruit();
const fruitMat2=new THREE.MeshPhysicalMaterial({color:0xD4941A,roughness:0.78,clearcoat:0.04,clearcoatRoughness:0.9,sheen:1,sheenRoughness:0.75,sheenColor:new THREE.Color(0xF5DEB3)});
const fruitCount=fruitD.length;
const fruitInst=new THREE.InstancedMesh(fruitGeom,fruitMat2,fruitCount);
const fruitBases=[];
for(let i=0;i<fruitCount;i++){
  dum.position.copy(fruitD[i]);dum.rotation.set(Math.random()*0.5,Math.random()*6.28,Math.random()*0.5);
  const s=0.65+Math.random()*0.5;dum.scale.set(0.001,0.001,0.001);dum.updateMatrix();
  fruitInst.setMatrixAt(i,dum.matrix);
  fruitInst.setColorAt(i,new THREE.Color().setHSL(0.1+Math.random()*0.06,0.6+Math.random()*0.35,0.35+Math.random()*0.2));
  fruitBases.push({p:fruitD[i].clone(),q:dum.quaternion.clone(),s:s});
}
fruitInst.instanceMatrix.needsUpdate=true;
if(fruitInst.instanceColor)fruitInst.instanceColor.needsUpdate=true;
scene.add(fruitInst);

const stemG=new THREE.CylinderGeometry(0.002,0.003,0.05,6,1);
const stemM=new THREE.MeshStandardMaterial({color:0x4a3520,roughness:0.9});
const stems=[];
for(let i=0;i<fruitCount;i++){
  const s=new THREE.Mesh(stemG,stemM);s.position.copy(fruitD[i]).add(V3(0,0.035,0));
  s.scale.set(0.001,0.001,0.001);s.visible=false;scene.add(s);stems.push(s);
}
prog(84);

/* ===================== GROUND ===================== */
scene.add(Object.assign(new THREE.Mesh(new THREE.CircleGeometry(7,64),new THREE.MeshStandardMaterial({color:0x1a1008,roughness:1,transparent:true,opacity:0.35})),{rotation:{x:-Math.PI/2},position:{y:-0.06}}));

/* ===================== FIREFLIES ===================== */
const ffN=100,ffP=new Float32Array(ffN*3),ffS=[];
for(let i=0;i<ffN;i++){ffP[i*3]=(Math.random()-0.5)*10;ffP[i*3+1]=Math.random()*7+0.5;ffP[i*3+2]=(Math.random()-0.5)*10;ffS.push({x:(Math.random()-0.5)*0.004,y:(Math.random()-0.5)*0.002,z:(Math.random()-0.5)*0.004,ph:Math.random()*6.28});}
const ffGeo=new THREE.BufferGeometry();ffGeo.setAttribute('position',new THREE.BufferAttribute(ffP,3));
const ffMat=new THREE.PointsMaterial({color:0xc9a060,size:0.06,transparent:true,opacity:0,blending:THREE.AdditiveBlending,sizeAttenuation:true});
scene.add(new THREE.Points(ffGeo,ffMat));

/* ===================== BURST PARTICLES ===================== */
const bN=40,bP=new Float32Array(bN*3),bV=[],bL=new Float32Array(bN);
for(let i=0;i<bN;i++){bP[i*3+1]=-100;bV.push(V3(0,0,0));bL[i]=0;}
const bGeo=new THREE.BufferGeometry();bGeo.setAttribute('position',new THREE.BufferAttribute(bP,3));
const bMat=new THREE.PointsMaterial({color:0xe8c050,size:0.06,transparent:true,opacity:0,blending:THREE.AdditiveBlending,sizeAttenuation:true});
scene.add(new THREE.Points(bGeo,bMat));
function burst(pt){for(let i=0;i<bN;i++){bP[i*3]=pt.x;bP[i*3+1]=pt.y;bP[i*3+2]=pt.z;bV[i].set((Math.random()-0.5)*0.1,(Math.random()-0.2)*0.07,(Math.random()-0.5)*0.1);bL[i]=1;}bGeo.attributes.position.needsUpdate=true;}

/* ===================== FALLING LEAVES ===================== */
const fallingLeaves=[];
const flMats=[
  new THREE.MeshStandardMaterial({color:0x4a6a20,roughness:0.6,side:THREE.DoubleSide,transparent:true,opacity:0.85}),
  new THREE.MeshStandardMaterial({color:0x6a5a18,roughness:0.6,side:THREE.DoubleSide,transparent:true,opacity:0.8}),
  new THREE.MeshStandardMaterial({color:0x8a6a10,roughness:0.6,side:THREE.DoubleSide,transparent:true,opacity:0.75}),
];
function resetFL(m){m.position.set((Math.random()-0.5)*4,3.5+Math.random()*4,(Math.random()-0.5)*4);m.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,Math.random()*Math.PI);m.visible=false;}
for(let i=0;i<10;i++){
  const m=new THREE.Mesh(leafGeom,flMats[i%3]);const sc=0.5+Math.random()*0.5;m.scale.set(sc,sc,sc);
  resetFL(m);scene.add(m);
  fallingLeaves.push({mesh:m,vy:0.002+Math.random()*0.004,ss:1+Math.random()*2,sa:0.3+Math.random()*0.5,rs:(Math.random()-0.5)*0.025,ph:Math.random()*6.28});
}
prog(90);

/* ===================== GROWTH STATE ===================== */
const GSPEED=0.6;
const growthSources=[];
let touchPt=V3(0,-100,0),touchStr=0;
const touchLight=new THREE.PointLight(0xd4a050,0,4);scene.add(touchLight);
const touchGlow=new THREE.Mesh(new THREE.SphereGeometry(0.1,12,12),new THREE.MeshBasicMaterial({color:0xd4a050,transparent:true,opacity:0,blending:THREE.AdditiveBlending}));
scene.add(touchGlow);

function getAge(pos,time){
  let m=-999;
  for(const src of growthSources){const d=pos.distanceTo(src.p);const r=(time-src.t)*GSPEED;m=Math.max(m,r-d);}
  return m;
}

/* ===================== INTERACTION ===================== */
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2(-10,-10);
const rayTargets=branchMesh?[branchMesh]:[];

function onMove(e){
  pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const h=raycaster.intersectObjects(rayTargets,false);
  if(h.length){touchPt.copy(h[0].point);touchStr=Math.max(touchStr,0.7);renderer.domElement.style.cursor='pointer';}
  else renderer.domElement.style.cursor='grab';
}
function onDown(e){
  pointer.x=(e.clientX/innerWidth)*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const h=raycaster.intersectObjects(rayTargets,false);
  if(h.length){
    const pt=h[0].point;touchPt.copy(pt);touchStr=3;
    if(growthSources.length>=MAX_SRC)growthSources.shift();
    growthSources.push({p:pt.clone(),t:clock.getElapsedTime()});
    burst(pt);
    for(let i=0;i<3;i++){const fl=fallingLeaves[Math.floor(Math.random()*fallingLeaves.length)];fl.mesh.position.copy(pt).add(V3((Math.random()-0.5)*0.3,Math.random()*0.2,(Math.random()-0.5)*0.3));fl.mesh.visible=true;}
  }
}
renderer.domElement.addEventListener('pointermove',onMove);
renderer.domElement.addEventListener('pointerdown',onDown);
prog(95);

/* ===================== RESIZE ===================== */
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});

/* ===================== ANIMATION ===================== */
const clock=new THREE.Clock();
const swayAxis=V3(1,0.2,0.5).normalize();
const swayQ=new THREE.Quaternion(),finalQ=new THREE.Quaternion();
const scV=V3(1,1,1);const tMat=new THREE.Matrix4();
const unfurlAxis=V3(1,0,0);

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  controls.update();
  skyMat.uniforms.uTime.value=t;

  touchStr*=0.965;if(touchStr<0.005)touchStr=0;
  barkMat.uniforms.uTP.value.copy(touchPt);
  barkMat.uniforms.uTS.value=touchStr;

  // update growth uniforms for bark
  for(let i=0;i<MAX_SRC;i++){
    if(i<growthSources.length){
      gSrcArr[i].copy(growthSources[i].p);
      gRadArr[i]=(t-growthSources[i].t)*GSPEED;
    } else {gSrcArr[i].set(0,-100,0);gRadArr[i]=0;}
  }

  touchLight.position.copy(touchPt);touchLight.intensity=touchStr*1.2;
  touchGlow.position.copy(touchPt);touchGlow.material.opacity=touchStr*0.2;touchGlow.scale.setScalar(1+touchStr*0.4);

  // life level
  let lifeLevel=0;
  for(const src of growthSources) lifeLevel+=Math.min(8,(t-src.t)*GSPEED);
  lifeLevel=Math.min(1,lifeLevel*0.03);
  warmSpot.intensity=0.15+lifeLevel*0.55;
  canopyGlow.intensity=lifeLevel*0.45;
  ffMat.opacity=lifeLevel*0.4;

  // LEAVES — growth-based animation
  const touchR=2.5;
  for(let i=0;i<leafCount;i++){
    const lb=leafBases[i];
    const age=getAge(lb.p,t);
    let sc;
    if(age<0){sc=0.001;}
    else if(age<1.2){sc=lb.s*(age/1.2);}
    else{sc=lb.s;}

    let sway=age>1.0?1.0:0;
    if(touchStr>0.01&&age>0.3){const d=lb.p.distanceTo(touchPt);if(d<touchR)sway+=((touchR-d)/touchR)*touchStr*3;}
    const ang=(Math.sin(t*0.7+lb.ph)*0.025+Math.sin(t*1.2+lb.ph*2.3)*0.012)*sway;
    swayQ.setFromAxisAngle(swayAxis,ang);
    finalQ.copy(lb.q).multiply(swayQ);
    if(age>0&&age<1.2){const unfurl=(1-age/1.2)*1.2;const uQ=new THREE.Quaternion().setFromAxisAngle(unfurlAxis,unfurl);finalQ.multiply(uQ);}
    scV.set(sc,sc,sc);tMat.compose(lb.p,finalQ,scV);
    leafInst.setMatrixAt(i,tMat);
  }
  leafInst.instanceMatrix.needsUpdate=true;

  // FLOWERS
  for(let i=0;i<flowerCount;i++){
    const fb=flowerBases[i];const age=getAge(fb.p,t);
    let sc;
    if(age<1.5)sc=0.001;
    else if(age<2.5)sc=(age-1.5);
    else if(age<4.0)sc=1.0;
    else if(age<5.0)sc=Math.max(0.001,1.0-(age-4.0));
    else sc=0.001;
    scV.set(sc,sc,sc);tMat.compose(fb.p,fb.q,scV);
    flowerInst.setMatrixAt(i,tMat);
  }
  flowerInst.instanceMatrix.needsUpdate=true;

  // FRUITS
  for(let i=0;i<fruitCount;i++){
    const fr=fruitBases[i];const age=getAge(fr.p,t);
    let sc;
    if(age<3.0)sc=0.001;
    else if(age<4.5)sc=fr.s*((age-3.0)/1.5);
    else sc=fr.s;
    scV.set(sc,sc*(0.9+Math.sin(t+i)*0.02),sc);tMat.compose(fr.p,fr.q,scV);
    fruitInst.setMatrixAt(i,tMat);
    stems[i].visible=sc>0.01;
    if(sc>0.01){stems[i].scale.set(sc,sc,sc);}
  }
  fruitInst.instanceMatrix.needsUpdate=true;

  // FIREFLIES
  const fp=ffGeo.attributes.position;
  for(let i=0;i<ffN;i++){const s=ffS[i];fp.setX(i,fp.getX(i)+s.x+Math.sin(t*0.4+s.ph)*0.0012);fp.setY(i,fp.getY(i)+s.y+Math.sin(t*0.25+s.ph*1.5)*0.0008);fp.setZ(i,fp.getZ(i)+s.z+Math.cos(t*0.35+s.ph*0.8)*0.0012);if(Math.abs(fp.getX(i))>7||fp.getY(i)>9||fp.getY(i)<0||Math.abs(fp.getZ(i))>7)fp.setXYZ(i,(Math.random()-0.5)*7,Math.random()*6+1,(Math.random()-0.5)*7);}
  fp.needsUpdate=true;

  // FALLING LEAVES
  fallingLeaves.forEach(fl=>{if(!fl.mesh.visible)return;fl.mesh.position.y-=fl.vy;fl.mesh.position.x+=Math.sin(t*fl.ss+fl.ph)*fl.sa*0.008;fl.mesh.position.z+=Math.cos(t*fl.ss*0.7+fl.ph)*fl.sa*0.006;fl.mesh.rotation.x+=fl.rs;fl.mesh.rotation.z+=fl.rs*0.6;if(fl.mesh.position.y<-0.3)fl.mesh.visible=false;});

  // BURST
  let alive=false;
  for(let i=0;i<bN;i++){if(bL[i]>0){alive=true;bL[i]-=0.018;bV[i].y-=0.0008;bP[i*3]+=bV[i].x;bP[i*3+1]+=bV[i].y;bP[i*3+2]+=bV[i].z;if(bL[i]<=0)bP[i*3+1]=-100;}}
  if(alive){bGeo.attributes.position.needsUpdate=true;bMat.opacity=Math.max(0,...bL)*0.9;}

  // STAR TWINKLE
  scene.children.forEach(c=>{if(c.isSprite&&c.userData.twinklePhase!==undefined){c.material.opacity=0.4+0.5*Math.sin(t*c.userData.twinkleSpeed+c.userData.twinklePhase)*0.5+0.25;}});

  composer.render();
}

/* ===================== START ===================== */
prog(100);
setTimeout(()=>{document.getElementById('loading').classList.add('fade-out');document.getElementById('overlay').classList.add('visible');animate();},1000);
</script>
