<style>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const fill=document.getElementById('loading-fill');
const prog=p=>{fill.style.width=Math.min(p,100)+'%';};

/* ==================== SCENE SETUP ==================== */
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,0.1,600);
camera.position.set(7,3.5,7);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.05;
controls.autoRotate=true;controls.autoRotateSpeed=0.15;
controls.minDistance=2.5;controls.maxDistance=22;
controls.target.set(0,2.8,0);controls.maxPolarAngle=Math.PI*0.88;
controls.update();

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.35,0.6,0.4);
composer.addPass(bloom);
prog(8);

/* ==================== NATURAL SKY BACKGROUND ==================== */
// Soft gradient sky — dawn/dusk atmosphere with blurred foliage silhouette
const skyVS=`varying vec3 vDir;void main(){vDir=(modelMatrix*vec4(position,1.0)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`;
const skyFS=`
uniform float uTime;
varying vec3 vDir;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.0,a=0.5;mat2 r=mat2(0.8,0.6,-0.6,0.8);for(int i=0;i<4;i++){v+=a*noise(p);p=r*p*2.0;a*=0.5;}return v;}
void main(){
  vec3 d=normalize(vDir);
  // vertical gradient: ground to zenith
  float h=d.y*0.5+0.5; // 0 at horizon, 1 at zenith
  // dawn sky palette
  vec3 zenith=vec3(0.32,0.42,0.56);  // soft blue-grey
  vec3 mid=vec3(0.55,0.52,0.48);     // warm grey
  vec3 horizon=vec3(0.72,0.62,0.52); // warm amber at horizon
  vec3 ground=vec3(0.18,0.20,0.14);  // dark earth tone below
  vec3 col;
  if(h>0.5){
    col=mix(mid,zenith,smoothstep(0.5,1.0,h));
  } else if(h>0.3){
    col=mix(horizon,mid,smoothstep(0.3,0.5,h));
  } else {
    col=mix(ground,horizon,smoothstep(0.0,0.3,h));
  }
  // subtle warm glow near the horizon (like diffused sunlight)
  float sunGlow=exp(-pow((d.y-0.02)*6.0,2.0));
  col+=vec3(0.15,0.10,0.05)*sunGlow*0.5;
  // blurred foliage silhouette near the horizon
  float phi=atan(d.z,d.x);
  float foliage=fbm(vec2(phi*3.0,d.y*8.0+1.0))*smoothstep(0.25,0.1,d.y)*smoothstep(-0.1,0.05,d.y);
  col=mix(col,vec3(0.12,0.16,0.08),foliage*0.5);
  // atmospheric haze
  col+=vec3(0.05,0.04,0.03)*smoothstep(0.3,0.0,abs(d.y))*0.4;
  col*=0.65;
  gl_FragColor=vec4(col,1.0);
}`;
const skyMat=new THREE.ShaderMaterial({vertexShader:skyVS,fragmentShader:skyFS,uniforms:{uTime:{value:0}},side:THREE.BackSide});
scene.add(new THREE.Mesh(new THREE.IcosahedronGeometry(250,5),skyMat));
prog(14);

/* ==================== LIGHTING — natural, soft ==================== */
// Ambient: gentle fill from sky
scene.add(new THREE.AmbientLight(0x8090a0,0.5));
// Key light: warm directional (sun through clouds)
const sunLight=new THREE.DirectionalLight(0xf5e0c0,0.9);
sunLight.position.set(-5,12,8);scene.add(sunLight);
// Fill light: cool bounce from sky
const skyFill=new THREE.DirectionalLight(0x7090b0,0.25);
skyFill.position.set(4,6,-5);scene.add(skyFill);
// Rim light: subtle backlight
const rimL=new THREE.DirectionalLight(0xa0a0b0,0.2);
rimL.position.set(0,5,-10);scene.add(rimL);
// Warm point near trunk base — subtle warmth
const warmSpot=new THREE.PointLight(0xc9a060,0.12,14);
warmSpot.position.set(1,0.5,2);scene.add(warmSpot);
// Canopy glow — increases as tree grows
const canopyGlow=new THREE.PointLight(0x5a8a3a,0.0,12);
canopyGlow.position.set(-0.5,5,0);scene.add(canopyGlow);
prog(18);

/* ==================== BARK SHADER ==================== */
// Procedural bark with lenticels, longitudinal fissures, leaf scars, and dormant buds.
// Dead state: ashen grey. Alive state: warm brown with green moss highlights.
const MAX_SRC=8;
const gSrcArr=Array.from({length:MAX_SRC},()=>new THREE.Vector3(0,-100,0));
const gRadArr=new Array(MAX_SRC).fill(0);
// globalGrowth: 0→1, drives the entire bark to alive state at once
let globalGrowth=0;

const barkVS=`
varying vec3 vWP;varying vec3 vN;varying vec3 vVP;varying vec2 vUV;
void main(){
  vec4 wp=modelMatrix*vec4(position,1.0);vWP=wp.xyz;
  vN=normalize(mat3(modelMatrix)*normal);
  vVP=(viewMatrix*wp).xyz;
  vUV=uv;
  gl_Position=projectionMatrix*viewMatrix*wp;
}`;
const barkFS=`
uniform vec3 uGS[8];uniform float uGR[8];
uniform vec3 uTP;uniform float uTS;
uniform float uGlobalGrowth;
varying vec3 vWP;varying vec3 vN;varying vec3 vVP;varying vec2 vUV;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float hash21(vec2 p){return fract(sin(dot(p,vec2(269.5,183.3)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.0,a=0.5;mat2 r=mat2(0.8,0.6,-0.6,0.8);for(int i=0;i<5;i++){v+=a*noise(p);p=r*p*2.0;a*=0.5;}return v;}

// Voronoi for lenticels (small raised dots on bark)
float voronoi(vec2 p){
  vec2 i=floor(p),f=fract(p);float md=1.0;
  for(int y=-1;y<=1;y++)for(int x=-1;x<=1;x++){
    vec2 n=vec2(float(x),float(y));
    vec2 o=vec2(hash(i+n),hash21(i+n))*0.8+0.1;
    float d=length(n+o-f);md=min(md,d);
  }
  return md;
}

float getGrowth(){
  float m=uGlobalGrowth;
  for(int i=0;i<8;i++){
    float d=distance(vWP,uGS[i]);
    m=max(m,smoothstep(uGR[i],max(0.0,uGR[i]-1.2),d));
  }
  return clamp(m,0.0,1.0);
}

void main(){
  // bark UV based on cylindrical coords
  vec2 bk=vec2(atan(vWP.x,vWP.z)*2.0, vWP.y*4.0);

  // longitudinal fissures (deep vertical cracks)
  float fissure=fbm(bk*vec2(6.0,2.5));
  float fissureLine=smoothstep(0.35,0.50,fissure);

  // fine bark texture
  float fineTex=noise(bk*40.0)*0.08;

  // transverse cracks (horizontal)
  float transCrack=fbm(bk*vec2(2.0,8.0)+5.0);
  float transLine=smoothstep(0.44,0.50,transCrack)*0.18;

  // lenticels — small raised pores scattered on bark
  float lenticel=voronoi(bk*18.0);
  float lenticelDot=smoothstep(0.12,0.06,lenticel)*0.22;

  // leaf scars — larger, oval, scattered marks where old leaves fell
  float leafScar=voronoi(bk*5.0+vec2(3.7,1.2));
  float scarMark=smoothstep(0.15,0.08,leafScar)*smoothstep(3.0,1.5,vWP.y)*0.15;

  // dormant buds — tiny raised bumps near branch junctions
  float budVor=voronoi(bk*12.0+vec2(7.0,2.0));
  float budDot=smoothstep(0.10,0.05,budVor)*smoothstep(0.5,2.5,vWP.y)*0.12;

  float growth=getGrowth();

  // dead bark: ashen grey with subtle warm undertone
  vec3 deadBase=vec3(0.34,0.31,0.28);
  vec3 deadDark=vec3(0.14,0.12,0.11);
  // alive bark: warm brown with greenish tones
  vec3 liveBase=vec3(0.42,0.30,0.18);
  vec3 liveDark=vec3(0.20,0.14,0.08);

  vec3 base=mix(deadBase,liveBase,growth);
  vec3 dark=mix(deadDark,liveDark,growth);

  // compose bark surface
  float crackDepth=mix(0.8,0.45,growth);
  vec3 col=mix(base,dark,fissureLine*crackDepth+transLine);
  col+=fineTex*mix(vec3(0.06),vec3(0.10,0.07,0.03),growth);

  // lenticels — lighter raised dots
  col+=mix(vec3(0.06),vec3(0.12,0.08,0.04),growth)*lenticelDot;

  // leaf scars — slightly darker oval marks
  col-=vec3(0.06,0.04,0.02)*scarMark*growth;

  // dormant buds — greenish bumps when alive
  col+=vec3(0.04,0.08,0.02)*budDot*growth;

  // moss/lichen patches on alive bark
  float mossPatch=fbm(bk*3.0+vec2(2.0,5.0));
  float mossStr=smoothstep(0.55,0.7,mossPatch)*growth*0.25;
  col=mix(col,vec3(0.15,0.22,0.08),mossStr);

  // lighting
  vec3 ld=normalize(vec3(-0.5,1.0,0.8));
  float diff=max(dot(vN,ld),0.0);
  float ao=0.6+0.4*(1.0-fissureLine);
  col*=(0.30+diff*0.70)*ao;

  // rim highlight
  vec3 vd=normalize(-vVP);
  float rim=1.0-max(dot(vN,vd),0.0);
  col+=vec3(0.08,0.07,0.05)*pow(rim,3.0)*0.25;

  // normal perturbation for fissures (fake bump)
  float bumpStr=fissureLine*0.5+lenticelDot*0.3;
  col*=1.0-bumpStr*0.1;

  // touch glow
  float td=distance(vWP,uTP);
  col+=vec3(0.90,0.65,0.30)*exp(-td*2.5)*uTS*0.5;

  gl_FragColor=vec4(col,1.0);
}`;
const barkMat=new THREE.ShaderMaterial({
  vertexShader:barkVS,fragmentShader:barkFS,
  uniforms:{uGS:{value:gSrcArr},uGR:{value:gRadArr},uTP:{value:new THREE.Vector3(0,-100,0)},uTS:{value:0},uGlobalGrowth:{value:0}}
});
prog(24);

/* ==================== LEAF SHADER ==================== */
// Oblanceolate leaf: glossy dark green top with specular highlight,
// rusty-brown fuzzy underside. Subsurface scattering on edges.
const leafVS=`
varying vec3 vN;varying vec3 vWP;varying vec3 vVD;varying vec3 vCol;varying vec2 vLeafUV;
void main(){
  vec3 tp=position;vec3 tn=normal;
  vLeafUV=uv;
  #ifdef USE_INSTANCING
    tp=(instanceMatrix*vec4(tp,1.0)).xyz;
    tn=mat3(instanceMatrix)*tn;
  #endif
  vec4 wp=modelMatrix*vec4(tp,1.0);
  vWP=wp.xyz;vN=normalize(mat3(modelMatrix)*tn);
  vVD=normalize(cameraPosition-wp.xyz);
  #ifdef USE_INSTANCING_COLOR
    vCol=instanceColor;
  #else
    vCol=vec3(1.0);
  #endif
  gl_Position=projectionMatrix*viewMatrix*wp;
}`;
const leafFS=`
varying vec3 vN;varying vec3 vWP;varying vec3 vVD;varying vec3 vCol;varying vec2 vLeafUV;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
void main(){
  vec3 n=gl_FrontFacing?normalize(vN):-normalize(vN);
  vec3 v=normalize(vVD);
  vec3 l=normalize(vec3(-0.5,1.0,0.8));
  float diff=max(dot(n,l),0.0);
  float rim=pow(1.0-max(dot(n,v),0.0),3.0);

  // subsurface scattering: light passing through leaf edges
  float sss=pow(max(dot(-v,l),0.0),3.0)*0.25;
  sss+=rim*0.15;

  vec3 color;
  if(gl_FrontFacing){
    // adaxial (top): leathery, glossy dark green
    vec3 base=vec3(0.06,0.20,0.04)*vCol*2.0;
    // venation pattern — subtle midrib
    float vein=smoothstep(0.02,0.0,abs(vLeafUV.x-0.5))*0.15;
    base+=vec3(0.0,0.04,0.0)*vein;
    color=base*(0.30+diff*0.70);
    // glossy specular (waxy cuticle)
    vec3 h=normalize(l+v);
    float spec=pow(max(dot(n,h),0.0),60.0);
    color+=vec3(0.50,0.55,0.40)*spec*0.4;
    // rim light
    color+=vec3(0.04,0.08,0.02)*rim*0.3;
    // SSS warm glow at edges
    color+=vec3(0.15,0.25,0.05)*sss;
  } else {
    // abaxial (bottom): dense rusty-brown tomentum
    vec3 base=vec3(0.50,0.35,0.18);
    color=base*(0.22+diff*0.35);
    // fuzzy tomentum texture
    float fuzz=hash(floor(vWP.xz*300.0));
    float fuzz2=hash(floor(vWP.xz*150.0+vec2(77.0)));
    color+=vec3(0.12,0.06,0.02)*fuzz*0.20;
    color+=vec3(0.08,0.04,0.01)*fuzz2*0.15;
    // fuzzy rim (light scattering through hairs)
    color+=vec3(0.55,0.38,0.18)*pow(rim,1.5)*0.5;
    // SSS through leaf
    color+=vec3(0.10,0.15,0.03)*sss;
  }
  gl_FragColor=vec4(color,0.97);
}`;
const leafMat=new THREE.ShaderMaterial({
  vertexShader:leafVS,fragmentShader:leafFS,
  side:THREE.DoubleSide,transparent:true
});
prog(28);

/* ==================== TAPERED TUBE HELPER ==================== */
// Creates a smooth tube along a CatmullRomCurve3 with linearly-interpolated radius
function taperedTube(pts,rS,rE,segs,rad){
  const curve=new THREE.CatmullRomCurve3(pts);
  const g=new THREE.TubeGeometry(curve,segs,1.0,rad,false);
  const pos=g.attributes.position;const rs=rad+1;
  for(let ring=0;ring<=segs;ring++){
    const t=ring/segs,r=rS+(rE-rS)*t;
    const c=curve.getPointAt(Math.min(t,1));
    for(let j=0;j<=rad;j++){
      const idx=ring*rs+j;if(idx>=pos.count)continue;
      const dx=pos.getX(idx)-c.x,dy=pos.getY(idx)-c.y,dz=pos.getZ(idx)-c.z;
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d>0.0001){const s=r/d;pos.setXYZ(idx,c.x+dx*s,c.y+dy*s,c.z+dz*s);}
    }
  }
  pos.needsUpdate=true;g.computeVertexNormals();return g;
}

/* ==================== TREE STRUCTURE ==================== */
// Sympodial branching: main trunk splits, each fork produces a leading shoot
const brG=[];const leafD=[];const flowerD=[];const fruitD=[];

// Trunk — gently curved, slight lean
const trunk=[V3(0,0,0),V3(0.12,0.55,0.08),V3(-0.06,1.2,0.14),V3(0.14,1.9,-0.04),V3(0.02,2.55,0.08)];
brG.push(taperedTube(trunk,0.30,0.16,20,20));

// Main branches — asymmetric S-curves, Chinese aesthetic
const a0=trunk[4];
const brA=[a0,V3(a0.x+0.35,a0.y+0.55,a0.z+0.12),V3(a0.x+0.7,a0.y+1.3,a0.z-0.1),V3(a0.x+0.45,a0.y+2.1,a0.z+0.25),V3(a0.x+0.15,a0.y+2.8,a0.z+0.05)];
brG.push(taperedTube(brA,0.13,0.035,14,14));

const b0=trunk[3];
const brB=[b0,V3(b0.x-0.4,b0.y+0.3,b0.z+0.35),V3(b0.x-1.1,b0.y+0.15,b0.z+0.55),V3(b0.x-1.6,b0.y+0.7,b0.z+0.3),V3(b0.x-1.3,b0.y+1.4,b0.z+0.0)];
brG.push(taperedTube(brB,0.11,0.03,14,14));

const brC=[a0,V3(a0.x+0.1,a0.y+0.4,a0.z+0.5),V3(a0.x-0.15,a0.y+0.9,a0.z+1.1),V3(a0.x-0.3,a0.y+1.5,a0.z+1.3)];
brG.push(taperedTube(brC,0.09,0.025,12,12));

const d0=trunk[2];
const brD=[d0,V3(d0.x+0.5,d0.y+0.05,d0.z-0.35),V3(d0.x+1.1,d0.y-0.15,d0.z-0.6),V3(d0.x+1.5,d0.y+0.25,d0.z-0.9),V3(d0.x+1.7,d0.y+0.9,d0.z-0.65)];
brG.push(taperedTube(brD,0.10,0.028,14,14));

const e0=trunk[1];
const brE=[e0,V3(e0.x+0.4,e0.y+0.1,e0.z+0.2),V3(e0.x+0.7,e0.y-0.05,e0.z+0.35),V3(e0.x+0.9,e0.y+0.2,e0.z+0.25)];
brG.push(taperedTube(brE,0.07,0.02,10,10));

// Branch tips for sub-branch spawning

/* ==================== SUB-BRANCHES ==================== */
// Recursive sub-branch generation with leaf, flower, and fruit placement
function subBranch(start,dir,len,rad,depth,maxD){
  if(depth>maxD||rad<0.004)return;
  const n=3+Math.floor(Math.random()*2);
  const pts=[start.clone()];const d=dir.clone();
  for(let i=1;i<=n;i++){
    d.x+=(Math.random()-0.5)*0.25;d.z+=(Math.random()-0.5)*0.25;
    d.y+=(Math.random()-0.35)*0.18;d.normalize();
    pts.push(pts[i-1].clone().add(d.clone().multiplyScalar(len/n)));
  }
  brG.push(taperedTube(pts,rad,rad*0.45,Math.max(6,10-depth),Math.max(8,14-depth*2)));
  const end=pts[pts.length-1];

  // Place leaves at branch tips and along branches
  if(depth>=1){
    const lc=depth>=2?20+Math.floor(Math.random()*16):10+Math.floor(Math.random()*8);
    const sp=0.12+depth*0.06;
    for(let i=0;i<lc;i++){
      const off=V3((Math.random()-0.5)*sp*2,(Math.random()-0.5)*sp*1.5,(Math.random()-0.5)*sp*2);
      leafD.push({p:end.clone().add(off),n:off.clone().normalize().add(V3(0,0.3,0)).normalize()});
    }
    for(let j=1;j<pts.length-1;j++){
      if(Math.random()>0.65)continue;
      for(let k=0;k<4+Math.floor(Math.random()*4);k++){
        const o2=V3((Math.random()-0.5)*sp,(Math.random()-0.5)*sp*0.5,(Math.random()-0.5)*sp);
        leafD.push({p:pts[j].clone().add(o2),n:o2.clone().normalize().add(V3(0,0.3,0)).normalize()});
      }
    }
  }

  // Place flowers (panicle clusters) and fruits at branch ends
  if(depth>=1&&Math.random()>0.4){
    const fc=2+Math.floor(Math.random()*3);
    for(let i=0;i<fc;i++) flowerD.push(end.clone().add(V3((Math.random()-0.5)*0.1,Math.random()*0.06,(Math.random()-0.5)*0.1)));
    const frc=2+Math.floor(Math.random()*4);
    for(let i=0;i<frc;i++) fruitD.push(end.clone().add(V3((Math.random()-0.5)*0.16,-Math.random()*0.16-0.02,(Math.random()-0.5)*0.16)));
  }

  // Recurse: sympodial forking
  if(depth<maxD){
    const nc=depth<1?3:2+Math.floor(Math.random()*2);
    for(let i=0;i<nc;i++){
      const ed=d.clone();let pp=V3(1,0,0);if(Math.abs(ed.dot(pp))>0.9)pp=V3(0,0,1);
      const rt=V3().crossVectors(ed,pp).normalize();const fw=V3().crossVectors(rt,ed).normalize();
      const sa=0.35+Math.random()*0.4,az=(i/nc)*Math.PI*2+(Math.random()-0.5)*1.0;
      const cd=V3().addScaledVector(ed,Math.cos(sa)).addScaledVector(rt,Math.sin(sa)*Math.cos(az)).addScaledVector(fw,Math.sin(sa)*Math.sin(az));
      cd.y+=0.08*Math.max(0,1-depth*0.2);cd.normalize();
      subBranch(end,cd,len*(0.5+Math.random()*0.22),rad*(0.48+Math.random()*0.18),depth+1,maxD);
    }
  }
}

/* ==================== LEAF GEOMETRY — oblanceolate with serrated margin ==================== */
function mkLeaf(){
  const sh=new THREE.Shape();
  const w=0.048,l=0.14;
  // oblanceolate: narrow at base, widest near 2/3 up, pointed tip
  sh.moveTo(0,-l);
  sh.bezierCurveTo(w*0.2,-l*0.7, w*0.6,-l*0.3, w*0.95,-l*0.05);
  sh.bezierCurveTo(w*1.0, l*0.15, w*0.85, l*0.45, w*0.5, l*0.7);
  sh.bezierCurveTo(w*0.25, l*0.88, w*0.08, l*0.95, 0, l);
  sh.bezierCurveTo(-w*0.08, l*0.95, -w*0.25, l*0.88, -w*0.5, l*0.7);
  sh.bezierCurveTo(-w*0.85, l*0.45, -w*1.0, l*0.15, -w*0.95,-l*0.05);
  sh.bezierCurveTo(-w*0.6,-l*0.3, -w*0.2,-l*0.7, 0,-l);
  const g=new THREE.ShapeGeometry(sh,10);
  const p=g.attributes.position;
  // curve leaf: slight droop, midrib curl, serrated edge wobble
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i);
    const edgeDist=Math.abs(x)/w;
    // serrated margin: tiny sine waves along edge
    const serration=Math.sin(y*80)*0.0015*edgeDist;
    // midrib curl and natural droop
    const z=-Math.abs(x)*2.5*0.12+Math.sin(y*8)*0.003+serration;
    p.setX(i,x+serration*0.5);
    p.setZ(i,z);
  }
  p.needsUpdate=true;g.computeVertexNormals();return g;
}

// Eriobotrya japonica: terminal panicle, 5 white petals, ~20 yellow stamens
function mkPanicle(){
  const gs=[];
  // central florets
  for(let i=0;i<9;i++){
    const a=(i/9)*Math.PI*2+Math.random()*0.4;
    const h=i*0.005+Math.random()*0.003;
    const r=0.012+Math.random()*0.008;
    // 5-petal floret (simplified as slightly squished sphere)
    const s=new THREE.SphereGeometry(r,8,6);
    const pos=s.attributes.position;
    for(let j=0;j<pos.count;j++){
      const px=pos.getX(j),py=pos.getY(j),pz=pos.getZ(j);
      // flatten slightly to petal-like shape
      pos.setY(j,py*0.6);
    }
    pos.needsUpdate=true;
    s.translate(Math.cos(a)*0.018,h,Math.sin(a)*0.018);
    gs.push(s);
  }
  // stamens — tiny elongated forms radiating from center
  for(let i=0;i<12;i++){
    const a=(i/12)*Math.PI*2;
    const stamen=new THREE.CylinderGeometry(0.001,0.001,0.012,4,1);
    stamen.translate(Math.cos(a)*0.008,0.015,Math.sin(a)*0.008);
    stamen.rotateZ((Math.random()-0.5)*0.3);
    gs.push(stamen);
  }
  return mergeGeometries(gs,false);
}

// Loquat fruit: pyriform (pear-shaped), persistent calyx "star crown" at base
function mkFruit(){
  const g=new THREE.SphereGeometry(0.03,18,18);const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    let x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    // pyriform shape: elongated, narrower at stem end
    y*=1.3;
    if(y>0.01){const sq=1-y*3.0;x*=Math.max(0.5,sq);z*=Math.max(0.5,sq);}
    if(y<-0.01){const bl=1+Math.sin((-y/0.04)*Math.PI*0.5)*0.12;x*=bl;z*=bl;}
    p.setXYZ(i,x,y,z);
  }
  p.needsUpdate=true;g.computeVertexNormals();

  // calyx star crown — 5 small triangular sepals at the base
  const calyxGs=[g];
  for(let i=0;i<5;i++){
    const angle=(i/5)*Math.PI*2;
    const sepal=new THREE.ConeGeometry(0.006,0.018,4,1);
    sepal.translate(Math.cos(angle)*0.015,-0.04,Math.sin(angle)*0.015);
    sepal.rotateX(0.3);sepal.rotateY(angle);
    calyxGs.push(sepal);
  }
  return mergeGeometries(calyxGs,false);
}

/* ==================== GROWTH STATE ==================== */
// Growth propagates radially from touch points. On first touch, growth seeds
// are planted along the entire trunk so the whole tree greens up together.
const GSPEED=1.8;
const growthSources=[];
let touchPt=V3(0,-100,0),touchStr=0;
let firstTouchDone=false;

const touchLight=new THREE.PointLight(0xd4a050,0,4);scene.add(touchLight);
const touchGlow=new THREE.Mesh(
  new THREE.SphereGeometry(0.1,12,12),
  new THREE.MeshBasicMaterial({color:0xd4a050,transparent:true,opacity:0,blending:THREE.AdditiveBlending})
);
scene.add(touchGlow);

function getAge(pos,time){
  let m=-999;
  for(const src of growthSources){
    const d=pos.distanceTo(src.p);
    const r=(time-src.t)*GSPEED;
    m=Math.max(m,r-d);
  }
  return m;
}
// firstTouchTime tracks when the tree was first touched, for global growth ramp
let firstTouchTime=-1;

/* ==================== NAMED GROWTH FUNCTIONS ==================== */
// initiateGrowth: on first touch, seeds growth along the entire trunk and
// all major branch bases so the whole tree greens up simultaneously.
// Subsequent touches add extra growth sources for local bursts.
function initiateGrowth(touchPoint){
  const now=clock.getElapsedTime();
  if(!firstTouchDone){
    firstTouchDone=true;
    firstTouchTime=now;
    // seed along trunk
    for(const pt of trunk) growthSources.push({p:pt.clone(),t:now});
    // seed at all major branch tips and junctions
    const seedPts=[a0,b0,d0,e0,brA[2],brA[4],brB[2],brB[4],brC[2],brC[3],brD[2],brD[4],brE[2],brE[3]];
    for(const pt of seedPts) growthSources.push({p:pt.clone(),t:now});
    // seed at all sub-branch tip positions
    for(const tip of mainTips) growthSources.push({p:tip.pos.clone(),t:now});
  } else {
    if(growthSources.length>=128) growthSources.splice(0,16);
    growthSources.push({p:touchPoint.clone(),t:now});
  }
  burst(touchPoint);
}

// growShoots: updates bark shader growth uniforms and global growth ramp
function growShoots(t){
  // pick the 8 most impactful sources for shader (largest radius)
  const sorted=[...growthSources].map((s,i)=>({i,r:(t-s.t)*GSPEED})).sort((a,b)=>b.r-a.r);
  for(let i=0;i<MAX_SRC;i++){
    if(i<sorted.length){
      const src=growthSources[sorted[i].i];
      gSrcArr[i].copy(src.p);
      gRadArr[i]=sorted[i].r;
    } else {
      gSrcArr[i].set(0,-100,0);gRadArr[i]=0;
    }
  }
  // global growth: ramp entire bark to alive over 4 seconds after first touch
  if(firstTouchTime>0){
    globalGrowth=Math.min(1,Math.max(0,(t-firstTouchTime)/4.0));
    barkMat.uniforms.uGlobalGrowth.value=globalGrowth;
  }
}

// unfurlLeaves: animates leaf scale, unfurl rotation, and wind sway
function unfurlLeaves(t){
  const touchR=2.5;
  for(let i=0;i<leafCount;i++){
    const lb=leafBases[i];
    const age=getAge(lb.p,t);
    let sc;
    if(age<0) sc=0.001;
    else if(age<1.2) sc=lb.s*(age/1.2);
    else sc=lb.s;

    let sway=age>1.0?1.0:0;
    if(touchStr>0.01&&age>0.3){
      const d=lb.p.distanceTo(touchPt);
      if(d<touchR) sway+=((touchR-d)/touchR)*touchStr*3;
    }
    const ang=(Math.sin(t*0.7+lb.ph)*0.025+Math.sin(t*1.2+lb.ph*2.3)*0.012)*sway;
    swayQ.setFromAxisAngle(swayAxis,ang);
    finalQ.copy(lb.q).multiply(swayQ);

    // unfurl: young leaves start curled and open as they grow
    if(age>0&&age<1.2){
      const unfurl=(1-age/1.2)*1.2;
      const uQ=new THREE.Quaternion().setFromAxisAngle(unfurlAxis,unfurl);
      finalQ.multiply(uQ);
    }
    scV.set(sc,sc,sc);tMat.compose(lb.p,finalQ,scV);
    leafInst.setMatrixAt(i,tMat);
  }
  leafInst.instanceMatrix.needsUpdate=true;
}

// bloomFlowers: animates flower panicles — appear, peak, then fade
function bloomFlowers(t){
  for(let i=0;i<flowerCount;i++){
    const fb=flowerBases[i];
    const age=getAge(fb.p,t);
    let sc;
    if(age<1.5) sc=0.001;
    else if(age<2.5) sc=(age-1.5);
    else if(age<4.0) sc=1.0;
    else if(age<5.0) sc=Math.max(0.001,1.0-(age-4.0));
    else sc=0.001;
    scV.set(sc,sc,sc);tMat.compose(fb.p,fb.q,scV);
    flowerInst.setMatrixAt(i,tMat);
  }
  flowerInst.instanceMatrix.needsUpdate=true;
}

// developFruits: animates fruit growth — appear after flowers, grow and ripen
function developFruits(t){
  for(let i=0;i<fruitCount;i++){
    const fr=fruitBases[i];
    const age=getAge(fr.p,t);
    let sc;
    if(age<3.0) sc=0.001;
    else if(age<4.5) sc=fr.s*((age-3.0)/1.5);
    else sc=fr.s;

    // color transition: green → yellow → orange as fruit ripens
    if(age>=3.0){
      const ripeT=Math.min(1,(age-3.0)/3.0);
      const col=new THREE.Color();
      if(ripeT<0.5){
        col.setHSL(0.22-ripeT*0.14, 0.5+ripeT*0.3, 0.25+ripeT*0.15);
      } else {
        col.setHSL(0.12-(ripeT-0.5)*0.06, 0.6+ripeT*0.2, 0.32+ripeT*0.18);
      }
      fruitInst.setColorAt(i,col);
    }

    // gentle sway
    scV.set(sc,sc*(0.9+Math.sin(t+i)*0.02),sc);
    tMat.compose(fr.p,fr.q,scV);
    fruitInst.setMatrixAt(i,tMat);
    stems[i].visible=sc>0.01;
    if(sc>0.01) stems[i].scale.set(sc,sc,sc);
  }
  fruitInst.instanceMatrix.needsUpdate=true;
  if(fruitInst.instanceColor) fruitInst.instanceColor.needsUpdate=true;
}

/* ==================== INTERACTION ==================== */
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2(-10,-10);
const rayTargets=branchMesh?[branchMesh]:[];

function onMove(e){
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  pointer.x=(cx/innerWidth)*2-1;pointer.y=-(cy/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const h=raycaster.intersectObjects(rayTargets,false);
  if(h.length){touchPt.copy(h[0].point);touchStr=Math.max(touchStr,0.7);renderer.domElement.style.cursor='pointer';}
  else renderer.domElement.style.cursor='grab';
}
function onDown(e){
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  pointer.x=(cx/innerWidth)*2-1;pointer.y=-(cy/innerHeight)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const h=raycaster.intersectObjects(rayTargets,false);
  if(h.length){
    const pt=h[0].point;touchPt.copy(pt);touchStr=3;
    initiateGrowth(pt);
    // shake a few falling leaves loose on touch
    for(let i=0;i<3;i++){
      const fl=fallingLeaves[Math.floor(Math.random()*fallingLeaves.length)];
      fl.mesh.position.copy(pt).add(V3((Math.random()-0.5)*0.3,Math.random()*0.2,(Math.random()-0.5)*0.3));
      fl.mesh.visible=true;
    }
  }
}
renderer.domElement.addEventListener('pointermove',onMove);
renderer.domElement.addEventListener('pointerdown',onDown);
renderer.domElement.addEventListener('touchmove',e=>{e.preventDefault();onMove(e);},{passive:false});
renderer.domElement.addEventListener('touchstart',e=>{onDown(e);});
prog(95);

/* ==================== RESIZE ==================== */
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
});

/* ==================== ANIMATION LOOP ==================== */
const clock=new THREE.Clock();
const swayAxis=V3(1,0.2,0.5).normalize();
const swayQ=new THREE.Quaternion(),finalQ=new THREE.Quaternion();
const scV=V3(1,1,1);const tMat=new THREE.Matrix4();
const unfurlAxis=V3(1,0,0);

function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  controls.update();
  skyMat.uniforms.uTime.value=t;

  // decay touch glow
  touchStr*=0.965;if(touchStr<0.005)touchStr=0;
  barkMat.uniforms.uTP.value.copy(touchPt);
  barkMat.uniforms.uTS.value=touchStr;

  // named growth functions
  growShoots(t);
  unfurlLeaves(t);
  bloomFlowers(t);
  developFruits(t);

  // touch feedback lights
  touchLight.position.copy(touchPt);touchLight.intensity=touchStr*1.0;
  touchGlow.position.copy(touchPt);touchGlow.material.opacity=touchStr*0.18;touchGlow.scale.setScalar(1+touchStr*0.3);

  // overall life level — drives ambient effects
  let lifeLevel=0;
  for(const src of growthSources) lifeLevel+=Math.min(8,(t-src.t)*GSPEED);
  lifeLevel=Math.min(1,lifeLevel*0.03);
  warmSpot.intensity=0.12+lifeLevel*0.5;
  canopyGlow.intensity=lifeLevel*0.4;
  ffMat.opacity=lifeLevel*0.35;

  // fireflies
  const fp=ffGeo.attributes.position;
  for(let i=0;i<ffN;i++){
    const s=ffS[i];
    fp.setX(i,fp.getX(i)+s.x+Math.sin(t*0.4+s.ph)*0.001);
    fp.setY(i,fp.getY(i)+s.y+Math.sin(t*0.25+s.ph*1.5)*0.0007);
    fp.setZ(i,fp.getZ(i)+s.z+Math.cos(t*0.35+s.ph*0.8)*0.001);
    if(Math.abs(fp.getX(i))>7||fp.getY(i)>9||fp.getY(i)<0||Math.abs(fp.getZ(i))>7)
      fp.setXYZ(i,(Math.random()-0.5)*7,Math.random()*6+1,(Math.random()-0.5)*7);
  }
  fp.needsUpdate=true;

  // falling leaves
  fallingLeaves.forEach(fl=>{
    if(!fl.mesh.visible)return;
    fl.mesh.position.y-=fl.vy;
    fl.mesh.position.x+=Math.sin(t*fl.ss+fl.ph)*fl.sa*0.008;
    fl.mesh.position.z+=Math.cos(t*fl.ss*0.7+fl.ph)*fl.sa*0.006;
    fl.mesh.rotation.x+=fl.rs;fl.mesh.rotation.z+=fl.rs*0.6;
    if(fl.mesh.position.y<-0.3) fl.mesh.visible=false;
  });

  // burst particles
  let alive=false;
  for(let i=0;i<bN;i++){
    if(bL[i]>0){
      alive=true;bL[i]-=0.018;bV[i].y-=0.0008;
      bP[i*3]+=bV[i].x;bP[i*3+1]+=bV[i].y;bP[i*3+2]+=bV[i].z;
      if(bL[i]<=0) bP[i*3+1]=-100;
    }
  }
  if(alive){bGeo.attributes.position.needsUpdate=true;bMat.opacity=Math.max(0,...bL)*0.9;}

  composer.render();
}

/* ==================== START ==================== */
prog(100);
setTimeout(()=>{
  document.getElementById('loading').classList.add('fade-out');
  document.getElementById('overlay').classList.add('visible');
  animate();
},1000);
</script>
